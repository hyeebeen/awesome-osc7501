<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 304" width="1100" height="304"
     role="img"
     aria-label="OSC 7501 字节分段图：ESC ]、7501、;、state=working、:、app=demo、ESC \ 共七段，附每段十六进制与中英文含义"
     font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif'>
  <title>OSC 7501 字节分段图</title>

  <!-- 白色圆角背景卡片 -->
  <rect x="0.5" y="0.5" width="1099" height="303" rx="12" fill="#ffffff" stroke="#d0d7de"/>

  <!-- 段 1–3 上方：OSC 7501 头 / header -->
  <text x="208" y="40" font-size="12" fill="#1f2328" text-anchor="middle">OSC 7501 头</text>
  <text x="208" y="58" font-size="11" fill="#57606a" text-anchor="middle">header</text>
  <path d="M 40 78 V 68 H 376 V 78" fill="none" stroke="#818b98" stroke-width="1.5"/>

  <!-- 段 4–6 上方：数据 / data -->
  <text x="620" y="40" font-size="12" fill="#1f2328" text-anchor="middle">数据：key=value 用 : 连接</text>
  <text x="620" y="58" font-size="11" fill="#57606a" text-anchor="middle">data: key=value pairs joined by :</text>
  <path d="M 392 78 V 68 H 848 V 78" fill="none" stroke="#818b98" stroke-width="1.5"/>

  <!-- 段 1：ESC ] -->
  <rect x="40" y="88" width="96" height="164" rx="8" fill="#ddf4ff" stroke="#54aeff"/>
  <g font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace'>
    <text x="88" y="122" font-size="15" font-weight="600" fill="#1f2328" text-anchor="middle">ESC ]</text>
    <text x="88" y="154" font-size="13" fill="#57606a" text-anchor="middle">1b 5d</text>
  </g>
  <line x1="54" y1="192" x2="122" y2="192" stroke="#57606a" stroke-opacity="0.25"/>
  <text x="88" y="220" font-size="12" fill="#1f2328" text-anchor="middle">OSC 开始</text>
  <text x="88" y="240" font-size="11" fill="#57606a" text-anchor="middle">OSC introducer</text>

  <!-- 段 2：7501 -->
  <rect x="152" y="88" width="104" height="164" rx="8" fill="#fff8c5" stroke="#d4a72c"/>
  <g font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace'>
    <text x="204" y="122" font-size="15" font-weight="600" fill="#1f2328" text-anchor="middle">7501</text>
    <text x="204" y="154" font-size="13" fill="#57606a" text-anchor="middle">37 35 30 31</text>
  </g>
  <line x1="166" y1="192" x2="242" y2="192" stroke="#57606a" stroke-opacity="0.25"/>
  <text x="204" y="220" font-size="12" fill="#1f2328" text-anchor="middle">协议编号</text>
  <text x="204" y="240" font-size="11" fill="#57606a" text-anchor="middle">protocol number</text>

  <!-- 段 3：; -->
  <rect x="272" y="88" width="104" height="164" rx="8" fill="#eaeef2" stroke="#818b98"/>
  <g font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace'>
    <text x="324" y="122" font-size="15" font-weight="600" fill="#1f2328" text-anchor="middle">;</text>
    <text x="324" y="154" font-size="13" fill="#57606a" text-anchor="middle">3b</text>
  </g>
  <line x1="286" y1="192" x2="362" y2="192" stroke="#57606a" stroke-opacity="0.25"/>
  <text x="324" y="220" font-size="12" fill="#1f2328" text-anchor="middle">编号与数据分界</text>
  <text x="324" y="240" font-size="11" fill="#57606a" text-anchor="middle">separator</text>

  <!-- 段 4：state=working -->
  <rect x="392" y="88" width="208" height="164" rx="8" fill="#dafbe1" stroke="#4ac26b"/>
  <g font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace'>
    <text x="496" y="122" font-size="15" font-weight="600" fill="#1f2328" text-anchor="middle">state=working</text>
    <text x="496" y="154" font-size="13" fill="#57606a" text-anchor="middle">73 74 61 74 65 3d</text>
    <text x="496" y="174" font-size="13" fill="#57606a" text-anchor="middle">77 6f 72 6b 69 6e 67</text>
  </g>
  <line x1="406" y1="192" x2="586" y2="192" stroke="#57606a" stroke-opacity="0.25"/>
  <text x="496" y="220" font-size="12" fill="#1f2328" text-anchor="middle">必填：状态</text>
  <text x="496" y="240" font-size="11" fill="#57606a" text-anchor="middle">required: state</text>

  <!-- 段 5：: -->
  <rect x="616" y="88" width="100" height="164" rx="8" fill="#eaeef2" stroke="#818b98"/>
  <g font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace'>
    <text x="666" y="122" font-size="15" font-weight="600" fill="#1f2328" text-anchor="middle">:</text>
    <text x="666" y="154" font-size="13" fill="#57606a" text-anchor="middle">3a</text>
  </g>
  <line x1="630" y1="192" x2="702" y2="192" stroke="#57606a" stroke-opacity="0.25"/>
  <text x="666" y="220" font-size="12" fill="#1f2328" text-anchor="middle">键值对分隔</text>
  <text x="666" y="240" font-size="11" fill="#57606a" text-anchor="middle">pair separator</text>

  <!-- 段 6：app=demo -->
  <rect x="732" y="88" width="116" height="164" rx="8" fill="#fbefff" stroke="#8250df"/>
  <g font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace'>
    <text x="790" y="122" font-size="15" font-weight="600" fill="#1f2328" text-anchor="middle">app=demo</text>
    <text x="790" y="154" font-size="13" fill="#57606a" text-anchor="middle">61 70 70 3d</text>
    <text x="790" y="174" font-size="13" fill="#57606a" text-anchor="middle">64 65 6d 6f</text>
  </g>
  <line x1="746" y1="192" x2="834" y2="192" stroke="#57606a" stroke-opacity="0.25"/>
  <text x="790" y="220" font-size="12" fill="#1f2328" text-anchor="middle">可选：程序名</text>
  <text x="790" y="240" font-size="11" fill="#57606a" text-anchor="middle">optional: app name</text>

  <!-- 段 7：ESC \ -->
  <rect x="864" y="88" width="204" height="164" rx="8" fill="#ffebe9" stroke="#cf222e"/>
  <g font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace'>
    <text x="966" y="122" font-size="15" font-weight="600" fill="#1f2328" text-anchor="middle">ESC \</text>
    <text x="966" y="154" font-size="13" fill="#57606a" text-anchor="middle">1b 5c</text>
  </g>
  <line x1="878" y1="192" x2="950" y2="192" stroke="#57606a" stroke-opacity="0.25"/>
  <text x="966" y="220" font-size="12" fill="#1f2328" text-anchor="middle">结束符 ST（也可用 BEL 07）</text>
  <text x="966" y="240" font-size="11" fill="#57606a" text-anchor="middle">terminator ST (or BEL 07)</text>

  <!-- 底部小字 -->
  <text x="550" y="284" font-size="11" fill="#57606a" text-anchor="middle">终端识别后不显示这些字节 · the terminal consumes these bytes instead of printing them</text>
</svg>
