# CI — same sequence as `sh scripts/check.sh`:
# validate -> build --check -> unit tests -> markdownlint.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install Python deps
        run: pip install pyyaml jsonschema

      - name: Validate data files against schema
        run: python3 scripts/validate.py

      - name: Generated files up to date
        run: python3 scripts/build.py --check

      - name: Unit tests
        run: python3 -m unittest discover -s examples

      - name: markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          globs: '**/*.md'
